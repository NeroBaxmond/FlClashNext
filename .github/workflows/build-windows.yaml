name: build-windows

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture to build"
        type: choice
        options:
          - amd64
          - arm64
          - both
        default: amd64

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-amd64:
    if: ${{ inputs.arch == 'amd64' || inputs.arch == 'both' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - run: flutter --version

      - name: Get Flutter Dependency
        run: flutter pub get

      - name: Setup Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup
        run: dart setup.dart windows --arch amd64

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: artifact-windows-amd64
          path: ./dist
          overwrite: true

  windows-arm64:
    if: ${{ inputs.arch == 'arm64' || inputs.arch == 'both' }}
    runs-on: windows-11-arm
    steps:
      - name: Setup Rust for Windows ARM64
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter (ARM)
        uses: subosito/flutter-action@v2
        with:
          channel: "master"
          cache: true

      - run: flutter --version

      - name: Get Flutter Dependency
        run: flutter pub get

      - name: Setup Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup
        run: dart setup.dart windows --arch arm64

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: artifact-windows-arm64
          path: ./dist
          overwrite: true
